name: V1 one-shot runtime hotfix

on:
  push:
    branches: [feature/v1-master-implementation]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1-master-implementation
      - name: Patch initialization order and render boot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game-v1.js')
          s = p.read_text()
          old = s
          s = s.replace('let commandConsole=createCommandConsole();', 'let commandConsole;')
          marker = "const keys=new Set();let jumpQueued=false"
          if marker in s and 'commandConsole=createCommandConsole();\nconst keys=' not in s:
              s = s.replace(marker, "commandConsole=createCommandConsole();\n" + marker)
          s = s.replace('function resetSystems(nextWorld){flux.dispose?.();worldRenderer.dispose?.();world=nextWorld;', 'function resetSystems(nextWorld){flux.dispose?.();worldRenderer.dispose?.();entityRenderer?.dispose?.();weatherRenderer?.dispose?.();world=nextWorld;')
          old_animate = "function animate(now){const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));lastFrame=now;if(!paused){updatePlayer(dt);updateTarget();updateMining(dt);updateSimulation(dt);updateSky(dt);}else updateSky(0);updateRender(dt);updateStats(dt);renderer.setAnimationLoop(animate);}"
          new_animate = "function animate(now){const dt=Math.min(.05,Math.max(0,(now-lastFrame)/1000));lastFrame=now;if(ready){if(!paused){updatePlayer(dt);updateTarget();updateMining(dt);updateSimulation(dt);updateSky(dt);}else updateSky(0);updateRender(dt);updateStats(dt);}else{renderer.render(scene,camera);}}"
          s = s.replace(old_animate, new_animate)
          if s == old:
              raise SystemExit('Expected V1 hotfix patterns were not found')
          p.write_text(s)
          PY
      - name: Verify patched runtime
        run: npm run check && npm test
      - name: Commit hotfix and remove one-shot workflow
        run: |
          git config user.name "VoxelCraft CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v1-hotfix.yml
          git add src/game-v1.js
          git commit -m "Fix V1 browser initialization and progressive render boot [skip hotfix]"
          git push origin HEAD:feature/v1-master-implementation
