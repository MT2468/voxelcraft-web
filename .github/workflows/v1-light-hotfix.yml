name: V1 one-shot light integration

on:
  push:
    branches: [feature/v1-master-implementation]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip light]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v1-master-implementation
      - name: Integrate LightEngine into renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/v1/renderer.js');s=p.read_text();old=s
          s=s.replace("import { createTextureAtlas } from './texture-atlas.js';", "import { createTextureAtlas } from './texture-atlas.js';\nimport { LightEngine } from './lighting.js';")
          s=s.replace("this.rebuildBudget=1;this.generationBudget=1;this.targetCenter='';this.pending=[];}", "this.rebuildBudget=1;this.generationBudget=1;this.targetCenter='';this.pending=[];this.lightEngine=new LightEngine(world);}")
          s=s.replace("this.atlas.texture.dispose();this.meshes.clear();this.pending=[];}", "this.atlas.texture.dispose();this.lightEngine.dispose();this.meshes.clear();this.pending=[];}")
          s=s.replace("const ccx=Math.floor(centerX/16),ccz=Math.floor(centerZ/16),centerKey=q(ccx,ccz);", "const ccx=Math.floor(centerX/16),ccz=Math.floor(centerZ/16),centerKey=q(ccx,ccz);this.lightEngine.updateAround(centerX,this.world.surfaceY(centerX,centerZ),centerZ,1);")
          s=s.replace("geometryForChunk(this.world,chunk,this.atlas,false),liquidData=geometryForChunk(this.world,chunk,this.atlas,true)", "geometryForChunk(this.world,chunk,this.atlas,this.lightEngine,false),liquidData=geometryForChunk(this.world,chunk,this.atlas,this.lightEngine,true)")
          s=s.replace("function geometryForChunk(world,chunk,atlas,liquidPass)", "function geometryForChunk(world,chunk,atlas,lightEngine,liquidPass)")
          old_light="let light=1;if(world.dimension==='overworld'){const sky=fastSkyLight(world,chunk,lx+dx,y+dy,lz+dz,x+dx,z+dz)/15;light=.18+.82*sky;}else light=world.dimension==='emberdeep'?.42:.55;const emits=def.emits||0;if(emits)light=Math.max(light,.45+emits/30);"
          new_light="const combined=lightEngine?.combinedAt(x+dx,y+dy,z+dz)??15;let light=.16+.84*(combined/15);if(world.dimension==='emberdeep')light=Math.max(.30,light);else if(world.dimension==='voidlands')light=Math.max(.34,light);const emits=def.emits||0;if(emits)light=Math.max(light,.45+emits/30);"
          s=s.replace(old_light,new_light)
          if s==old: raise SystemExit('No renderer patterns changed')
          p.write_text(s)
          PY
      - name: Verify
        run: npm run check && npm test
      - name: Commit and remove workflow
        run: |
          git config user.name "VoxelCraft CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v1-light-hotfix.yml
          git add src/v1/renderer.js
          git commit -m "Integrate cached block light propagation [skip light]"
          git push origin HEAD:feature/v1-master-implementation
