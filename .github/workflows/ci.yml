name: VoxelCraft CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Required project files
        shell: bash
        run: |
          test -s index.html
          test -s style-v4.css
          test -s src/game-v4.js
          test -s src/survival.js
          test -s src/mobs.js
          test -s src/audio.js
          test -s src/noise.js
          grep -q 'type="module" src="./src/game-v4.js"' index.html
          grep -q 'style-v4.css' index.html
          grep -q 'three@0.185.1' index.html
          grep -q 'PointerLockControls' src/game-v4.js
          grep -q 'updateChunks' src/game-v4.js
          grep -q 'Inventory' src/game-v4.js
          grep -q 'SurvivalState' src/game-v4.js
          grep -q 'MobSystem' src/game-v4.js
          grep -q 'localStorage' src/game-v4.js
