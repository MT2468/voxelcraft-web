name: VoxelCraft CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Required V1 architecture
        shell: bash
        run: |
          test -s index.html
          test -s style-v1.css
          test -s src/game-v1.js
          test -s src/v1/catalog.js
          test -s src/v1/systems.js
          test -s src/v1/world.js
          test -s src/v1/automation.js
          test -s src/v1/entities.js
          test -s src/v1/renderer.js
          test -s src/v1/save-db.js
          test -s src/v1/commands.js
          test -s src/v1/multiplayer.js
          test -s server/server.mjs
          grep -q 'type="module" src="./src/game-v1.js"' index.html
          grep -q 'style-v1.css' index.html
          grep -q 'three@0.185.1' index.html
          grep -q 'PointerLockControls' src/game-v1.js
          grep -q 'WorldV1' src/game-v1.js
          grep -q 'InventoryV1' src/game-v1.js
          grep -q 'FluxSystem' src/game-v1.js
          grep -q 'PortalSystem' src/game-v1.js
          grep -q 'EntityManagerV1' src/game-v1.js
          grep -q 'SaveDB' src/game-v1.js
          grep -q 'MultiplayerClient' src/game-v1.js
          grep -q 'IndexedDB' README.md || true
