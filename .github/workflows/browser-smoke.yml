name: VoxelCraft Browser Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Playwright and server dependency
        run: |
          npm install --no-save playwright@1.62.1 ws@8.18.3
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/voxelcraft-http.log 2>&1 &
          sleep 2
      - name: Chromium WebGL smoke test
        run: node test/browser-smoke.mjs
      - name: Start authoritative multiplayer server
        run: |
          PORT=8791 node server/server.mjs > /tmp/voxelcraft-ws.log 2>&1 &
          for i in {1..20}; do
            if node -e "const n=require('net').connect(8791,'127.0.0.1',()=>{n.end();process.exit(0)});n.on('error',()=>process.exit(1))"; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/voxelcraft-ws.log
          exit 1
      - name: Authoritative multiplayer smoke test
        run: node test/multiplayer-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-browser-smoke
          path: artifacts/
          if-no-files-found: ignore
