name: VoxelCraft Browser Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Playwright and server dependency
        run: |
          npm install --no-save playwright@1.62.1 ws@8.21.3
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 > /tmp/voxelcraft-http.log 2>&1 &
          sleep 2
      - name: Chromium WebGL smoke test
        run: node test/browser-smoke.mjs
      - name: Authoritative multiplayer smoke test
        run: node test/multiplayer-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-browser-smoke
          path: artifacts/
          if-no-files-found: ignore
